# Included in the server block AND in every location that sets a header of
# its own. nginx does not merge add_header across levels: a location with any
# add_header of its own silently drops every one from the server block. The
# first deployment lost HSTS and the CSP exactly that way - on the console
# that shows PUKs.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
