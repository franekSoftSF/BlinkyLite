# Shared by every location that forwards to the server.

# TLS to the server too, verified: the certificate bundle holds the chain up to
# the root, and the name checked is the one the certificate was issued for.
# An unverified hop inside Docker is still a hop the operator's password and
# every PUK travel over.
proxy_ssl_server_name         on;
proxy_ssl_name                ${BLINKYLITE_SERVER_NAME};
proxy_ssl_verify              on;
proxy_ssl_trusted_certificate /certs/blinkylite.crt;
proxy_ssl_verify_depth        4;

# The audit records where every sign-in and every disclosure came from. Without
# these the server would record nginx's container address for all of them.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;

# Negotiate (0025) carries its token in Authorization; nginx passes it as is.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Nothing from the API is cacheable: responses carry PUKs and tokens.
include /etc/nginx/security-headers.conf;
add_header Cache-Control "no-store" always;
