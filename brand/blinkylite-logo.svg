<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400">
  <title>BlinkyLite</title>
  <!--
    The horizontal logo for the README and anything wide. The wordmark is
    "Blinky" in white and "Lite" in the accent, as on the concept board. Text
    is text, not outlines: a renderer without Segoe UI falls back to another
    bold sans, which changes the letters, not the logo. blinkylite-logo.png is
    this file rendered (brand/build-assets.mjs), for places that cannot show SVG.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C140F"/>
      <stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="lite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDB74"/>
      <stop offset="1" stop-color="#1DB954"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="32" fill="url(#bg)"/>

  <image href="blinkylite-mark.svg" xlink:href="blinkylite-mark.svg" x="72" y="64" width="272" height="272"/>

  <text x="392" y="232" font-family="Segoe UI, Montserrat, Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-3">
    <tspan fill="#FFFFFF">Blinky</tspan><tspan fill="url(#lite)">Lite</tspan>
  </text>

  <text x="398" y="300" font-family="Segoe UI, Montserrat, Arial, sans-serif" font-size="34" letter-spacing="9">
    <tspan fill="#D8DDD9">SECURE CREDENTIALS.</tspan><tspan fill="#3DDB74" dx="22">SIMPLY.</tspan>
  </text>
</svg>
