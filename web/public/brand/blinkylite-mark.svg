<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>BlinkyLite</title>
  <!--
    The BlinkyLite mark: a security key, tilted, inside a green arc, on a dark
    tile. Drawn after the concept board of 21.09.2026, with two deliberate
    differences: the touch sensor carries no vendor logo (the "y" on the board
    is Yubico's trademark), and the shapes are plain enough to survive 16 px.
    Colours are Palette.cs: #1DB954 accent, #3DDB74 accent text on dark.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101A13"/>
      <stop offset="1" stop-color="#07100A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B211D"/>
      <stop offset="1" stop-color="#0B0E0C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C35B"/>
      <stop offset="1" stop-color="#B8871F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#1DB954" stroke-width="6" filter="url(#glow)"/>

  <!-- The arc: open at the top and the bottom, where the key passes through it. -->
  <g fill="none" stroke="#1DB954" stroke-width="14" stroke-linecap="round" filter="url(#glow)">
    <path d="M 97.8 164.8 A 182 182 0 0 0 164.8 413.6"/>
    <path d="M 414.2 164.8 A 182 182 0 0 1 347.2 413.6"/>
  </g>

  <g transform="rotate(35 256 256)">
    <!-- Connector first, so the body overlaps its top edge. -->
    <rect x="221" y="336" width="70" height="92" rx="8" fill="#0E120F" stroke="#3DDB74" stroke-width="5"/>
    <rect x="232" y="352" width="13" height="60" rx="2" fill="url(#gold)"/>
    <rect x="250" y="352" width="13" height="60" rx="2" fill="url(#gold)"/>
    <rect x="268" y="352" width="13" height="60" rx="2" fill="url(#gold)"/>

    <rect x="191" y="84" width="130" height="264" rx="30" fill="url(#body)" stroke="#3DDB74" stroke-width="6" filter="url(#glow)"/>

    <!-- Key-ring hole. -->
    <circle cx="256" cy="132" r="22" fill="#07100A" stroke="#3DDB74" stroke-width="6"/>
    <circle cx="256" cy="132" r="11" fill="#1DB954" filter="url(#glow)"/>

    <!-- Touch sensor: a ring and a point, nobody's logo. -->
    <circle cx="256" cy="244" r="42" fill="#0D110E" stroke="#1DB954" stroke-width="7" filter="url(#glow)"/>
    <circle cx="256" cy="244" r="13" fill="#3DDB74"/>
  </g>
</svg>
